<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Parity Score — {{ module_name }}">
<meta property="og:description" content="Verified {{ "%.0f"|format(score * 100) }}% behavioral equivalence">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Parity Score — {{ module_name }}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #020617;
    color: #f1f5f9;
  }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(139, 92, 246, 0.25) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(59, 130, 246, 0.2) 0%, transparent 70%),
      radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15, 23, 42, 1) 0%, #020617 100%);
    overflow: hidden;
  }

  /* Subtle grid pattern */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Glowing ring behind score */
  .score-ring {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, {{ glow_color }}22 0%, transparent 70%);
    filter: blur(40px);
  }

  .logo {
    position: absolute;
    top: 36px;
    left: 48px;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .icon { font-size: 1.6rem; }

  .module-label {
    position: absolute;
    top: 40px;
    right: 48px;
    font-size: 1rem;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .score-section {
    text-align: center;
    position: relative;
    z-index: 1;
    margin-top: -20px;
  }

  .score-label {
    font-size: 1rem;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .score-value {
    font-size: 8rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    color: {{ score_color }};
    text-shadow: 0 0 60px {{ score_color }}44, 0 0 120px {{ score_color }}22;
  }

  .score-unit {
    font-size: 3rem;
    font-weight: 700;
    color: {{ score_color }}aa;
  }

  .progression {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 24px;
    font-size: 1.1rem;
    color: #94a3b8;
  }

  .progression .rate {
    font-weight: 700;
    font-size: 1.3rem;
  }

  .progression .rate-first { color: {{ first_pass_color }}; }
  .progression .rate-final { color: {{ final_color }}; }

  .progression .arrow {
    color: #4ade80;
    font-size: 1.4rem;
  }

  .bug-callout {
    margin-top: 28px;
    max-width: 700px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .bug-callout .bug-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #ef4444;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .bug-callout .bug-text {
    font-size: 1rem;
    color: #cbd5e1;
    line-height: 1.5;
    padding: 0 48px;
  }

  .footer-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.8);
    border-top: 1px solid #1e293b;
  }

  .built-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #a78bfa;
  }
</style>
</head>
<body>

<div class="card">
  <div class="score-ring"></div>

  <div class="logo">
    <span class="icon">⚖️</span> Parity
  </div>

  <div class="module-label">{{ module_name }}</div>

  <div class="score-section">
    <div class="score-label">Behavioral Match Score</div>
    <div class="score-value">
      {{ "%.0f"|format(score * 100) }}<span class="score-unit">%</span>
    </div>
  </div>

  <div class="progression">
    <span>First-Pass</span>
    <span class="rate rate-first">{{ "%.0f"|format(first_pass_rate * 100) }}%</span>
    <span class="arrow">→</span>
    <span>Final</span>
    <span class="rate rate-final">{{ "%.0f"|format(final_rate * 100) }}%</span>
  </div>

  {% if scariest_bug %}
  <div class="bug-callout">
    <div class="bug-label">🐛 Scariest Bug Found</div>
    <div class="bug-text">{{ scariest_bug }}</div>
  </div>
  {% endif %}

  <div class="footer-bar">
    <div class="built-badge">✨ Built with Muse Spark Open</div>
  </div>
</div>

</body>
</html>
